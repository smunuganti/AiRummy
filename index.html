<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ai Rummy Online | Verified Build</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { 
            --gold: #ffd700; --gold-grad: linear-gradient(180deg, #ffd700 0%, #b8860b 100%);
            --deep-green: radial-gradient(circle at 50% 40%, #165b33 0%, #050a07 100%);
            --card-w: 13.5vw; --card-h: 20vw;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; touch-action: manipulation; }
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100dvh; width: 100vw; }

        /* --- LOBBY DESIGN --- */
        #lobby {
            position: fixed; inset: 0; z-index: 5000; background: var(--deep-green);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .casino-panel {
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); border: 2px solid var(--gold);
            padding: 30px; border-radius: 24px; width: 90%; max-width: 380px; text-align: center;
        }
        .tree-mini { font-size: 1.5rem; margin: 10px 0; color: var(--gold); }
        input { width: 100%; padding: 15px; margin: 15px 0; border-radius: 10px; border: none; font-size: 1.2rem; text-align: center; font-weight: bold; background: #222; color: var(--gold); }

        /* --- GAME UI --- */
        #game-view { display: none; flex-direction: column; height: 100dvh; }
        .header { height: 50px; background: #000; display: flex; align-items: center; padding: 0 15px; border-bottom: 2px solid var(--gold); }
        .table { flex: 1; background: var(--deep-green); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .grid-mobile { height: 40vh; background: #050a07; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; padding: 10px; border-top: 1px solid var(--gold); }
        .slot { background: rgba(255, 215, 0, 0.05); border: 1px dashed rgba(255, 215, 0, 0.2); border-radius: 12px; position: relative; }
        
        /* --- CARDS --- */
        .card { width: var(--card-w); height: var(--card-h); max-width: 55px; max-height: 80px; background: #fff; color: #000; border-radius: 5px; font-weight: bold; border: 1px solid #999; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        .card.red { color: #d42426; }
        .card-back { background: #0a2e1a; border: 1.5px solid var(--gold); }
        
        .btn-gold { background: var(--gold-grad); color: #1a472a; border: none; padding: 15px; border-radius: 50px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .waiting-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="lobby">
        <div class="casino-panel">
            <h1 style="color:var(--gold); margin-bottom: 5px;">Ai Rummy</h1>
            <p style="font-size: 0.7rem; letter-spacing: 3px; opacity: 0.8;">REVEAL THE JOKER</p>
            <div class="tree-mini">★<br>▲<br>■</div>
            <input type="text" id="roomInput" placeholder="ROOM CODE">
            <button class="btn-gold" style="width:100%; margin-bottom: 10px;" onclick="connect('host')">Create Tournament</button>
            <button class="btn-gold" style="width:100%; background: #fff; color: #000;" onclick="connect('join')">Join Room</button>
        </div>
    </div>

    <div id="wait-overlay" class="waiting-overlay">
        <h2 style="color:var(--gold)">CONNECTING...</h2>
        <p>Ensure your friend uses the same code.</p>
    </div>

    <div id="game-view">
        <div class="header">
            <div style="flex:1">ROOM: <span id="room-id-display" style="color:var(--gold)"></span></div>
            <div id="turn-status" style="flex:1; text-align: center; font-weight: bold;">SYNCING...</div>
            <div style="flex:1; text-align: right;">YOU: <span id="my-score">0</span></div>
        </div>
        
        <div class="table">
            <div id="opponent-hand" style="display:flex; margin-bottom: 20px; opacity: 0.5;"></div>
            <div style="width:90%; height:110px; border:5px solid #2b1b0d; border-radius:60px; background:#163d26; display:flex; justify-content:center; align-items:center; gap:20px; box-shadow: inset 0 0 30px #000;">
                <div id="joker-box" class="card card-back" style="width:35px; height:50px; border-color:var(--gold)"></div>
                <div class="card card-back" onclick="drawFromDeck()"></div>
                <div id="discard-pile" class="card"></div>
            </div>
        </div>

        <div class="grid-mobile">
            <div class="slot" id="g0" onclick="dropSelected(0)"></div>
            <div class="slot" id="g1" onclick="dropSelected(1)"></div>
            <div class="slot" id="g2" onclick="dropSelected(2)"></div>
            <div class="slot" id="g3" onclick="dropSelected(3)"></div>
        </div>
    </div>

<script>
    // --- FIREBASE SYNC ENGINE ---
    // (You will add your Config here from the Firebase Console)
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCar3KmHlupEW6Q-54Oj84n1sjWCjSmmQk",
  authDomain: "ai-rummy.firebaseapp.com",
  projectId: "ai-rummy",
  storageBucket: "ai-rummy.firebasestorage.app",
  messagingSenderId: "188469967334",
  appId: "1:188469967334:web:13cceec9c8d9f131d23e27",
  measurementId: "G-W7YJJ8JYT3"
};

    function startOnlineGame() {
        document.getElementById('wait-overlay').style.display = 'none';
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('game-view').style.display = 'flex';
        
        isMyTurn = (playerRole === 'host');
        updateTurnUI();
    }

    function updateTurnUI() {
        const status = document.getElementById('turn-status');
        if(isMyTurn) {
            status.innerText = "YOUR TURN";
            status.style.color = "var(--gold)";
        } else {
            status.innerText = "OPPONENT'S TURN";
            status.style.color = "#ff4757";
        }
    }

    /* --- DATA ARCHITECTURE FOR ONLINE SYNC --- */
    // To ensure the game never desyncs, we use a single source of truth in Firebase:
    /* rooms/{roomID}: {
        gameState: "playing",
        turn: "host",
        discardPile: [card_objects],
        joker: {rank, suit},
        p1Hand: [card_objects],
        p2Hand: [card_objects]
    }
    */
</script>
</body>
</html>
