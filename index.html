<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rummy Scorekeeper Mobile</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --danger: #e74c3c;
            --bg: #f4f7f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px; /* Perfect for phone screens */
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 { text-align: center; color: var(--primary); margin-top: 0; }

        /* Scoreboard Layout */
        .scoreboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .player-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #eee;
        }

        .player-card.active { border-color: var(--accent); }

        .score-display {
            font-size: 2.5rem;
            font-weight: bold;
            display: block;
            margin: 5px 0;
        }

        /* Input Area */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box; /* Prevents overflow */
            -webkit-appearance: none; /* Removes iOS inner shadow */
        }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active { opacity: 0.7; }

        .btn-add { background: var(--accent); color: white; }
        .btn-reset { background: var(--primary); color: white; }

        /* History Table - Scrollable for mobile */
        .history-container {
            margin-top: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: center;
        }

        /* Large touch targets for buttons */
        @media (max-width: 480px) {
            .score-display { font-size: 2rem; }
            button { padding: 18px; } /* Even bigger for thumbs */
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎴 Rummy Score</h2>
    
    <div class="scoreboard">
        <div class="player-card">
            <div>You</div>
            <span class="score-display" id="userScore">0</span>
        </div>
        <div class="player-card">
            <div>Santosh</div>
            <span class="score-display" id="santoshScore">0</span>
        </div>
    </div>

    <div class="input-group">
        <div class="btn-row">
            <input type="number" id="userIn" placeholder="Your Pts" inputmode="numeric">
            <input type="number" id="santoshIn" placeholder="Santosh Pts" inputmode="numeric">
        </div>
        <button class="btn-add" onclick="addScores()">ADD ROUND</button>
        <button class="btn-reset" onclick="resetGame()">RESET GAME</button>
    </div>

    <div class="history-container">
        <table id="historyTable">
            <thead>
                <tr>
                    <th>Round</th>
                    <th>You</th>
                    <th>Santosh</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    let scores = JSON.parse(localStorage.getItem('rummyScores')) || { user: 0, santosh: 0, history: [] };

    function updateUI() {
        document.getElementById('userScore').innerText = scores.user;
        document.getElementById('santoshScore').innerText = scores.santosh;
        
        const tbody = document.querySelector('#historyTable tbody');
        tbody.innerHTML = scores.history.map((r, i) => `
            <tr>
                <td>${i + 1}</td>
                <td>${r.u}</td>
                <td>${r.s}</td>
            </tr>
        `).join('');
        
        localStorage.setItem('rummyScores', JSON.stringify(scores));
    }

    function addScores() {
        const uIn = parseInt(document.getElementById('userIn').value) || 0;
        const sIn = parseInt(document.getElementById('santoshIn').value) || 0;

        scores.user += uIn;
        scores.santosh += sIn;
        scores.history.push({ u: uIn, s: sIn });

        document.getElementById('userIn').value = '';
        document.getElementById('santoshIn').value = '';
        updateUI();

        if (scores.user >= 201 || scores.santosh >= 201) {
            alert(scores.user >= 201 ? "Santosh Wins! (You crossed 201)" : "You Win! (Santosh crossed 201)");
        }
    }

    function resetGame() {
        if(confirm("Start a new game?")) {
            scores = { user: 0, santosh: 0, history: [] };
            updateUI();
        }
    }

    updateUI();
</script>

</body>
</html>
