<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ai Rummy | Vibrant 2026</title>
    <style>
        :root { 
            --gold: #ffcc33; 
            --xmas-red: #ff3333;
            --matrix-green: #00ff41;
            --ai-cyan: #00f2ff;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: #000; color: white; 
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
        }

        /* --- VIBRANT FULL-SCREEN HOME --- */
        #home-screen {
            position: fixed; inset: 0; z-index: 2000;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1511193311914-0346f16efe90?q=80&w=2073&auto=format&fit=crop');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 60px 20px;
        }

        /* FLOATING PIP DECORATIONS */
        .pip-deco {
            position: absolute; font-size: 3rem; opacity: 0.6;
            filter: drop-shadow(0 0 10px white);
            animation: float 4s ease-in-out infinite;
        }

        .main-title-area { z-index: 10; }
        .festive-tag {
            font-size: 1.2rem; letter-spacing: 10px; color: var(--gold);
            text-shadow: 0 0 15px var(--gold); font-weight: bold;
            margin-bottom: 10px; animation: pulse 2s infinite;
        }
        .main-title { 
            font-size: 5rem; font-weight: 900; margin: 0;
            background: linear-gradient(to bottom, #fff 30%, var(--gold) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(255,204,51,0.5));
        }

        /* SMOOTH FLOATING BOT */
        .bot-avatar-large {
            width: 160px; height: 160px; border-radius: 50%;
            border: 4px solid var(--matrix-green);
            background: url('http://googleusercontent.com/image_generation_content/0');
            background-size: cover; background-position: center;
            box-shadow: 0 0 40px var(--matrix-green);
            animation: float 3s ease-in-out infinite;
            position: relative;
        }

        .cta-area { width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .play-btn {
            background: var(--gold); color: #000; border: none;
            padding: 20px 80px; border-radius: 50px; font-size: 1.5rem;
            font-weight: 900; cursor: pointer; text-transform: uppercase;
            letter-spacing: 2px; transition: 0.3s;
            box-shadow: 0 10px 30px rgba(255, 204, 51, 0.4);
        }
        .play-btn:hover {
            transform: scale(1.1); box-shadow: 0 0 50px var(--gold);
        }

        @keyframes float { 
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        @keyframes pulse { 0% { opacity: 0.6; } 100% { opacity: 1; } }

        /* --- SNOW & FIREWORKS --- */
        canvas { position: fixed; inset: 0; pointer-events: none; z-index: 2001; }
    </style>
</head>
<body>

    <canvas id="snow-canvas"></canvas>
    <canvas id="fireworks-canvas"></canvas>

    <div id="home-screen">
        <div class="pip-deco" style="top: 15%; left: 10%; color: var(--xmas-red);">♥</div>
        <div class="pip-deco" style="top: 25%; right: 15%; color: white; animation-delay: 1s;">♠</div>
        <div class="pip-deco" style="bottom: 30%; left: 15%; color: var(--gold); animation-delay: 2s;">♦</div>
        <div class="pip-deco" style="bottom: 20%; right: 10%; color: white; animation-delay: 1.5s;">♣</div>

        <div class="main-title-area">
            <div class="festive-tag">HAPPY NEW YEAR 2026</div>
            <h1 class="main-title">Ai Rummy</h1>
        </div>

        <div class="bot-avatar-large"></div>

        <div class="cta-area">
            <p style="color: white; letter-spacing: 4px; font-weight: bold; margin-bottom: 25px; text-shadow: 0 2px 4px black;">
                AI BOT PROTOCOL <span style="color: var(--matrix-green);">ONLINE</span>
            </p>
            <button class="play-btn" onclick="dealSequence()">Enter Table</button>
        </div>
    </div>

    <script>
        // Matrix Rain + Snow + Fireworks Logic Integrated
        const sCanvas = document.getElementById('snow-canvas');
        const sCtx = sCanvas.getContext('2d');
        let flakes = [];
        
        function resize() { 
            sCanvas.width = window.innerWidth; sCanvas.height = window.innerHeight; 
        }
        window.onresize = resize; resize();

        for(let i=0; i<100; i++) {
            flakes.push({
                x: Math.random() * sCanvas.width,
                y: Math.random() * sCanvas.height,
                r: Math.random() * 3 + 1,
                s: Math.random() * 1 + 0.5
            });
        }

        function drawSnow() {
            sCtx.clearRect(0,0,sCanvas.width,sCanvas.height);
            sCtx.fillStyle = "white";
            sCtx.beginPath();
            flakes.forEach(f => {
                sCtx.moveTo(f.x, f.y);
                sCtx.arc(f.x, f.y, f.r, 0, Math.PI*2);
                f.y += f.s;
                if(f.y > sCanvas.height) f.y = -10;
            });
            sCtx.fill();
            requestAnimationFrame(drawSnow);
        }
        drawSnow();

        function dealSequence() {
            // Transition to Game Table Logic
            document.getElementById('home-screen').style.transition = '2s';
            document.getElementById('home-screen').style.opacity = '0';
            document.getElementById('home-screen').style.transform = 'scale(1.5)';
            setTimeout(() => {
                alert("Dealing cards in 4K resolution...");
                location.reload(); // Placeholder for transition
            }, 1000);
        }
    </script>
</body>
</html>
