        .grid-mobile { height: 40vh; background: #050a07; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; padding: 10px; border-top: 1px solid var(--gold); }
        .slot { background: rgba(255, 215, 0, 0.05); border: 1px dashed rgba(255, 215, 0, 0.2); border-radius: 12px; position: relative; }
        
        /* --- CARDS --- */
        .card { width: var(--card-w); height: var(--card-h); max-width: 55px; max-height: 80px; background: #fff; color: #000; border-radius: 5px; font-weight: bold; border: 1px solid #999; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }

        .card-back { background: #0a2e1a; border: 1.5px solid var(--gold); }
        
        .btn-gold { background: var(--gold-grad); color: #1a472a; border: none; padding: 15px; border-radius: 50px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .waiting-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; }

const db = firebase.database();

let roomRef;
let myHand = []; // Local hand for the active player

// --- 2. JOINING & INITIALIZING ---
async function connect(role) {
    const roomID = document.getElementById('roomInput').value.toUpperCase();
    if(!roomID) return alert("Enter Room Code");
    
    playerRole = role;
    roomRef = db.ref('rooms/' + roomID);

    if(role === 'host') {
        // Host sets up the initial deck and game state
        const initialDeck = createDeck();
        const p1Hand = initialDeck.splice(0, 13);
        const p2Hand = initialDeck.splice(0, 13);
        const joker = initialDeck.pop();
        const firstDiscard = initialDeck.pop();

        await roomRef.set({
            deck: initialDeck,
            p1Hand: p1Hand,
            p2Hand: p2Hand,
            joker: joker,
            discard: [firstDiscard],
            turn: 'host', // Host starts
            status: 'playing'
        });
    }

    // Listen for changes from the other player
    roomRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) syncGame(data);
    });

    startOnlineGame();
}

// --- 3. THE SYNC ENGINE ---
function syncGame(data) {
    // Determine if it's my turn
    isMyTurn = (data.turn === playerRole);
    
    // Update Global UI
    document.getElementById('discard-pile').innerHTML = renderCard(data.discard[data.discard.length - 1]);
    document.getElementById('joker-box').innerHTML = renderCard(data.joker);
    
    // Update local hand based on role
    myHand = (playerRole === 'host') ? data.p1Hand : data.p2Hand;
    
    renderLocalHand();
    updateTurnUI();
}

// --- 4. ACTION SYNCING ---
async function handleDiscard(cardIndex) {
    if(!isMyTurn) return;

    const snapshot = await roomRef.once('value');
    const data = snapshot.val();
    
    // 1. Move card from hand to discard
    const cardToDiscard = myHand.splice(cardIndex, 1)[0];
    data.discard.push(cardToDiscard);

    // 2. Switch Turn
    const nextTurn = (playerRole === 'host') ? 'join' : 'host';

    // 3. Update Firebase
    const updates = {
        discard: data.discard,
        turn: nextTurn
    };
    if(playerRole === 'host') updates.p1Hand = myHand;
    else updates.p2Hand = myHand;

    roomRef.update(updates);
}

async function drawFromDeck() {
    if(!isMyTurn || myHand.length >= 14) return;

    const snapshot = await roomRef.once('value');
    const data = snapshot.val();
    
    const newCard = data.deck.pop();
    myHand.push(newCard);

    const updates = { deck: data.deck };
    if(playerRole === 'host') updates.p1Hand = myHand;
    else updates.p2Hand = myHand;

    roomRef.update(updates);
}
