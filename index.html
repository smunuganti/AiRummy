<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ai Rummy | Grand Royale</title>
    <style>
        :root { 
            --gold: #ffd700; --gold-grad: linear-gradient(180deg, #ffd700 0%, #b8860b 100%);
            --deep-felt: radial-gradient(circle at 50% 40%, #165b33 0%, #050a07 100%);
            --card-w: 14vw; --card-h: 21vw;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; touch-action: manipulation; }
        body { background: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; height: 100dvh; }

        /* --- NAVIGATION --- */
        .page { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; transition: opacity 0.3s; }
        .hidden { display: none !important; }

        /* --- LOBBY & TREE --- */
        #home-page { background: var(--deep-felt); padding-top: 5vh; justify-content: flex-start; z-index: 100; }
        .tree-container { transform: scale(0.85); margin-top: -20px; margin-bottom: 20px; }
        .tree-row { display: flex; justify-content: center; margin-top: -35px; }
        .t-card { width: 55px; height: 80px; background: #fff; border-radius: 6px; border: 1.5px solid var(--gold); margin: 2px; color: #000; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px #000; }
        
        .lobby-panel { background: rgba(0,0,0,0.85); padding: 25px; border-radius: 24px; border: 2px solid var(--gold); width: 90%; max-width: 360px; text-align: center; }
        .tab-group { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 10px; border: 1px solid var(--gold); color: var(--gold); border-radius: 8px; font-size: 0.7rem; font-weight: 800; cursor: pointer; }
        .tab.active { background: var(--gold); color: #000; }

        /* --- GAME VIEW --- */
        #game-view { background: var(--deep-felt); z-index: 50; }
        .header { width: 100%; height: 60px; background: #000; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 2px solid var(--gold); }
        .felt-rim { width: 94%; height: 130px; background: #163d26; border: 5px solid #2b1b0d; border-radius: 70px; display: flex; justify-content: center; align-items: center; gap: 15px; box-shadow: inset 0 0 40px #000; }
        
        .grid-slots { width: 100%; height: 42vh; background: #050a07; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; padding: 8px; border-top: 2px solid var(--gold); }
        .slot { border: 1px dashed rgba(255,215,0,0.2); border-radius: 10px; position: relative; display: flex; flex-wrap: wrap; gap: 2px; padding: 4px; }
        .slot::after { content: attr(data-label); position: absolute; bottom: 4px; right: 8px; font-size: 0.45rem; color: var(--gold); opacity: 0.3; }

        .card { width: var(--card-w); height: var(--card-h); max-width: 55px; background: #fff; color: #000; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: 900; border: 1px solid #999; }
        .card-back { background: #0a2e1a; border: 1.5px solid var(--gold); }

        .controls { width: 100%; height: 85px; background: #000; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; }
        .btn-action { background: #111; color: var(--gold); border: 1px solid var(--gold); border-radius: 8px; font-size: 0.6rem; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>

    <div id="home-page" class="page">
        <h1 style="color:var(--gold); font-size: 2.8rem; margin-top: 20px;">Ai Rummy</h1>
        <p style="letter-spacing: 4px; font-size: 0.6rem; opacity: 0.7; margin-bottom: 20px;">REVEAL THE JOKER</p>

        <div class="tree-container">
            <div class="tree-row"><div class="t-card" style="color:red">A♥</div></div>
            <div class="tree-row"><div class="t-card">K♠</div><div class="t-card" style="color:red">Q♦</div></div>
            <div class="tree-row"><div class="t-card" style="color:red">J♥</div><div class="t-card">10♣</div><div class="t-card">9♠</div></div>
            <div style="display:flex; justify-content:center; margin-top:-5px;"><div style="width:35px; height:45px; background:#3d1c02; border-radius:2px;"></div></div>
        </div>

        <div class="lobby-panel">
            <div class="tab-group">
                <div id="ai-tab" class="tab active" onclick="setMode('ai')">VS PANDU AI</div>
                <div id="online-tab" class="tab" onclick="setMode('online')">ONLINE</div>
            </div>
            <div id="online-input" class="hidden" style="margin-bottom:15px;">
                <input type="text" id="roomInput" placeholder="ROOM CODE" style="width:100%; padding:12px; border-radius:10px; text-align:center; font-weight:900; background:#222; border:none; color:#fff;">
            </div>
            <button onclick="handleStart()" style="width:100%; padding:16px; border-radius:50px; background:var(--gold-grad); border:none; font-weight:900; cursor:pointer;">START MATCH</button>
        </div>
    </div>

    <div id="game-view" class="page hidden">
        <div class="header">
            <div style="font-size:1.6rem; cursor:pointer;" onclick="goHome()">🏠</div>
            <div id="status-txt" style="font-weight:900; color:var(--gold);">YOUR TURN</div>
            <div id="score-txt" style="font-size:0.7rem; color:var(--gold);">P1: 0 | AI: 0</div>
        </div>

        <div style="flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;">
            <div class="felt-rim">
                <div style="width:36px; height:54px; background:#000; border:1px solid var(--gold); border-radius:4px; display:flex; align-items:center; justify-content:center; color:var(--gold); font-size:10px;">JOKER</div>
                <div style="display:flex; gap:12px;">
                    <div class="card card-back" onclick="console.log('Draw Deck')"></div>
                    <div id="discard-pile" class="card" style="font-size:1.2rem;">K♠</div>
                </div>
            </div>
        </div>

        <div class="grid-slots">
            <div class="slot" id="g0" data-label="PURE SEQ"></div>
            <div class="slot" id="g1" data-label="G2"></div>
            <div class="slot" id="g2" data-label="G3"></div>
            <div class="slot" id="g3" data-label="G4"></div>
        </div>

        <div class="controls">
            <button class="btn-action">SORT</button>
            <button class="btn-action" style="color:red">DROP</button>
            <button class="btn-action" style="background:var(--gold); color:#000;">DISCARD</button>
            <button class="btn-action" style="background:#2ecc71; color:#fff;">SHOW</button>
        </div>
    </div>

    <script>
        let currentMode = 'ai';

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('ai-tab').classList.toggle('active', mode === 'ai');
            document.getElementById('online-tab').classList.toggle('active', mode === 'online');
            document.getElementById('online-input').classList.toggle('hidden', mode === 'ai');
        }

        function handleStart() {
            // Instant UI Switch
            document.getElementById('home-page').classList.add('hidden');
            document.getElementById('game-view').classList.remove('hidden');

            if (currentMode === 'online') {
                const code = document.getElementById('roomInput').value;
                console.log("Online Mode: Initializing Room " + code);
                // Here is where you'd call your Firebase init function
            } else {
                console.log("AI Mode: Initializing Pandu...");
                initMatch(); // Call your AI game start logic
            }
        }

        function goHome() {
            if (confirm("Return to Lobby? Progress will be saved.")) {
                document.getElementById('game-view').classList.add('hidden');
                document.getElementById('home-page').classList.remove('hidden');
            }
        }

        function initMatch() {
            // Placeholder for your card dealing logic
            document.getElementById('status-txt').innerText = "YOUR TURN";
            console.log("Match Started Successfully");
        }
    </script>
</body>
</html>
