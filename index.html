<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Rummy: 201 Pool - Holiday Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle, #1a365d 0%, #0f172a 100%); color: white; min-height: 100vh; overflow-x: hidden; }
        .snowflake { position: fixed; top: -10px; color: white; pointer-events: none; z-index: 50; animation: fall linear infinite; }
        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }
        .card-tree-node { transition: transform 0.3s ease; }
        .card-tree-node:hover { transform: scale(1.1) rotate(0deg) !important; z-index: 10; }
    </style>
</head>
<body class="p-4 flex flex-col items-center">

    <div id="snow-container"></div>

    <header class="text-center mb-6 z-20">
        <h1 class="text-4xl font-black text-red-500 drop-shadow-md">AI RUMMY <span class="text-white text-lg block italic">201 Pool Tournament</span></h1>
    </header>

    <div class="relative flex flex-col items-center mb-8 z-20">
        <div class="text-yellow-400 text-4xl animate-pulse mb-1">⭐</div>
        <div class="flex -space-x-2 mb-[-15px]">
            <div class="card-tree-node w-10 h-14 bg-white border-2 border-red-600 rounded shadow-lg flex items-center justify-center font-bold text-red-600 rotate-[-5deg]">A♥</div>
        </div>
        <div class="flex -space-x-4 mb-[-15px]">
            <div class="card-tree-node w-10 h-14 bg-white border-2 border-slate-800 rounded shadow-lg flex items-center justify-center font-bold text-black rotate-[-12deg]">K♠</div>
            <div class="card-tree-node w-10 h-14 bg-white border-2 border-red-600 rounded shadow-lg flex items-center justify-center font-bold text-red-600 rotate-[12deg]">Q♦</div>
        </div>
        <div class="flex -space-x-4">
            <div class="card-tree-node w-10 h-14 bg-white border-2 border-slate-800 rounded shadow-lg flex items-center justify-center font-bold text-black rotate-[-20deg]">J♣</div>
            <div class="card-tree-node w-10 h-14 bg-white border-2 border-red-600 rounded shadow-lg flex items-center justify-center font-bold text-red-600">10♥</div>
            <div class="card-tree-node w-10 h-14 bg-white border-2 border-slate-800 rounded shadow-lg flex items-center justify-center font-bold text-black rotate-[20deg]">9♠</div>
        </div>
        <div class="w-6 h-6 bg-amber-900 rounded-b"></div>
    </div>

    <main class="w-full max-w-lg bg-white/10 backdrop-blur-md rounded-2xl p-6 border border-white/20 z-20 shadow-2xl">
        
        <div class="flex justify-between mb-6 bg-black/30 p-4 rounded-xl">
            <div class="text-center">
                <p class="text-xs uppercase text-blue-300">You</p>
                <p id="p-total" class="text-3xl font-black">0</p>
            </div>
            <div class="text-center border-x border-white/10 px-4">
                <p class="text-[10px] uppercase text-gray-400">Round</p>
                <p id="round-count" class="text-xl font-bold">1</p>
            </div>
            <div class="text-center">
                <p class="text-xs uppercase text-red-400">AI Bot</p>
                <p id="ai-total" class="text-3xl font-black">0</p>
            </div>
        </div>

        <div id="game-controls" class="space-y-4">
            <button onclick="simulateRound()" class="w-full py-4 bg-red-600 hover:bg-red-700 rounded-xl font-bold text-lg transition-transform active:scale-95 shadow-lg">
                Play Next Round
            </button>
            <button onclick="resetGame()" class="w-full py-2 bg-transparent border border-white/30 rounded-lg text-sm hover:bg-white/10">
                Reset Tournament
            </button>
        </div>

        <div id="history" class="mt-6 text-xs text-gray-300 space-y-1 max-h-32 overflow-y-auto">
            </div>
    </main>

    <script>
        // --- GAME LOGIC ---
        let state = { p: 0, ai: 0, round: 1, history: [] };

        function simulateRound() {
            // Randomly decide winner for demo (Replace with your card logic)
            const pWin = Math.random() > 0.5;
            const points = Math.floor(Math.random() * 40) + 10;

            if (pWin) {
                state.ai += points;
                addHistory(`Round ${state.round}: You won! AI got +${points}`);
            } else {
                state.p += points;
                addHistory(`Round ${state.round}: AI won! You got +${points}`);
            }

            state.round++;
            updateUI();
            checkWinner();
        }

        function updateUI() {
            document.getElementById('p-total').innerText = state.p;
            document.getElementById('ai-total').innerText = state.ai;
            document.getElementById('round-count').innerText = state.round;
        }

        function addHistory(msg) {
            const h = document.getElementById('history');
            h.innerHTML = `<div>${msg}</div>` + h.innerHTML;
        }

        function checkWinner() {
            if (state.p >= 201) alert("Tournament Over: AI Wins! You crossed 201.");
            else if (state.ai >= 201) alert("Tournament Over: YOU WIN! AI crossed 201.");
        }

        function resetGame() {
            state = { p: 0, ai: 0, round: 1, history: [] };
            document.getElementById('history').innerHTML = '';
            updateUI();
        }

        // --- SNOW LOGIC ---
        function createSnow() {
            const container = document.getElementById('snow-container');
            const icons = ['❄', '❅', '❆', '•'];
            for (let i = 0; i < 40; i++) {
                const flake = document.createElement('div');
                flake.className = 'snowflake';
                flake.innerHTML = icons[Math.floor(Math.random() * icons.length)];
                flake.style.left = Math.random() * 100 + 'vw';
                flake.style.animationDuration = (Math.random() * 3 + 4) + 's';
                flake.style.opacity = Math.random();
                flake.style.fontSize = (Math.random() * 10 + 10) + 'px';
                container.appendChild(flake);
            }
        }
        createSnow();
    </script>
</body>
</html>
