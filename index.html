<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ai Rummy | Invite & Play</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // 1. YOUR FIREBASE CONFIG HERE
       const firebaseConfig = {
  apiKey: "AIzaSyCar3KmHlupEW6Q-54Oj84n1sjWCjSmmQk",
  authDomain: "ai-rummy.firebaseapp.com",
  projectId: "ai-rummy",
  storageBucket: "ai-rummy.firebasestorage.app",
  messagingSenderId: "188469967334",
  appId: "1:188469967334:web:13cceec9c8d9f131d23e27",
  measurementId: "G-W7YJJ8JYT3"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.copyInvite = () => {
            const code = document.getElementById('roomCode').value.toUpperCase();
            if(!code) return alert("Enter a Room Code first!");
            
            const inviteLink = window.location.href.split('?')[0] + "?room=" + code;
            const msg = `Let's play Ai Rummy! 🃏\nRoom Code: ${code}\nJoin here: ${inviteLink}`;
            
            navigator.clipboard.writeText(msg).then(() => {
                const btn = document.getElementById('share-btn');
                btn.innerText = "COPIED TO CLIPBOARD! ✅";
                btn.style.background = "#2ecc71";
                setTimeout(() => {
                    btn.innerText = "SHARE INVITE LINK 🔗";
                    btn.style.background = "none";
                }, 2000);
            });
        };

        // Auto-fill room code if link contains ?room=XXXX
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const rCode = urlParams.get('room');
            if(rCode) {
                document.getElementById('roomCode').value = rCode.toUpperCase();
                setOnline(); // Switch UI to online mode
            }
        });
    </script>
    <style>
        :root { 
            --gold: #ffd700; --gold-grad: linear-gradient(180deg, #ffd700 0%, #b8860b 100%);
            --deep-felt: radial-gradient(circle at 50% 40%, #165b33 0%, #050a07 100%);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100dvh; }

        #home-page { position: fixed; inset: 0; background: var(--deep-felt); display: flex; flex-direction: column; align-items: center; padding-top: 5vh; }
        
        /* THE TREE */
        .tree-container { display: flex; flex-direction: column; align-items: center; transform: scale(0.8); margin-bottom: 10px; }
        .tree-row { display: flex; justify-content: center; margin-top: -35px; }
        .card-ui { width: 50px; height: 75px; background: #fff; border-radius: 4px; border: 1.5px solid var(--gold); color: #000; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px #000; }
        
        .mode-box { background: rgba(0,0,0,0.85); padding: 25px; border-radius: 24px; border: 2.5px solid var(--gold); width: 90%; max-width: 380px; text-align: center; }
        .btn-main { background: var(--gold-grad); color: #000; border: none; padding: 16px; width: 100%; border-radius: 50px; font-weight: 900; cursor: pointer; margin-top: 10px; font-size: 1rem; }
        
        .share-btn { 
            margin-top: 15px; background: none; border: 1.5px solid var(--gold); color: var(--gold); 
            padding: 10px; width: 100%; border-radius: 50px; font-size: 0.7rem; font-weight: 800; 
            cursor: pointer; transition: 0.3s;
        }

        input { width: 100%; padding: 12px; border-radius: 10px; border: none; text-align: center; font-weight: 900; font-size: 1.1rem; margin-top: 10px; background: #222; color: #fff; }
    </style>
</head>
<body>

    <div id="home-page">
        <h1 style="color:var(--gold); font-size: 2.8rem; margin:0;">Ai Rummy</h1>
        <p style="letter-spacing: 4px; font-size: 0.6rem; margin-bottom: 20px; opacity: 0.8;">REVEAL THE JOKER</p>

        <div class="tree-container">
            <div class="tree-row"><div class="card-ui" style="color:red">A♥</div></div>
            <div class="tree-row"><div class="card-ui">K♠</div><div class="card-ui" style="color:red">Q♦</div></div>
            <div class="tree-row"><div class="card-ui" style="color:red">J♥</div><div class="card-ui">10♣</div><div class="card-ui">9♠</div></div>
            <div style="width:35px; height:40px; background:#3d1c02; border-radius:2px; margin-top:-5px;"></div>
        </div>

        <div class="mode-box">
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <button id="ai-tab" onclick="setMode('AI')" style="flex:1; padding:8px; border-radius:8px; border:1px solid var(--gold); background:var(--gold); color:#000; font-weight:800; font-size:0.65rem;">VS PANDU AI</button>
                <button id="online-tab" onclick="setMode('ONLINE')" style="flex:1; padding:8px; border-radius:8px; border:1px solid var(--gold); background:none; color:var(--gold); font-weight:800; font-size:0.65rem;">PLAY ONLINE</button>
            </div>
            
            <div id="online-area" style="display:none;">
                <input type="text" id="roomCode" placeholder="ROOM CODE (e.g. RUMMY7)">
                <button id="share-btn" class="share-btn" onclick="copyInvite()">SHARE INVITE LINK 🔗</button>
            </div>

            <button class="btn-main" onclick="handleStart()">START MATCH</button>
        </div>
    </div>

    <script>
        function setMode(m) {
            window.gameMode = m;
            document.getElementById('ai-tab').style.background = m==='AI' ? 'var(--gold)' : 'none';
            document.getElementById('ai-tab').style.color = m==='AI' ? '#000' : 'var(--gold)';
            document.getElementById('online-tab').style.background = m==='ONLINE' ? 'var(--gold)' : 'none';
            document.getElementById('online-tab').style.color = m==='ONLINE' ? '#000' : 'var(--gold)';
            document.getElementById('online-area').style.display = m==='ONLINE' ? 'block' : 'none';
        }
        
        function setOnline() { setMode('ONLINE'); } // Used for auto-filling from link
        
        function handleStart() {
            // Your Game Launch Logic here
            alert("Starting " + window.gameMode + " Match...");
        }
    </script>
</body>
</html>
