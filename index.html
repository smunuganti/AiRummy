<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ai Rummy | Festive Royale</title>
    <style>
        :root { 
            --gold: #ffd700; --gold-grad: linear-gradient(180deg, #ffd700 0%, #b8860b 100%);
            --xmas-red: #d42426; --deep-green: radial-gradient(circle at 50% 40%, #165b33 0%, #050a07 100%);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; touch-action: manipulation; }
        body { background: #000; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; height: 100dvh; width: 100vw; }

        #snow-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 5001; opacity: 0.6; }

        /* --- HOME PAGE STRUCTURE --- */
        #home-page {
            position: fixed; inset: 0; z-index: 5000; background: var(--deep-green);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 40px 0; overflow-y: auto;
        }

        .main-title { font-size: 3.5rem; font-weight: 900; color: var(--gold); text-shadow: 0 0 20px rgba(255,215,0,0.4); margin-bottom: 5px; }
        .sub-message { letter-spacing: 5px; font-size: 0.7rem; color: #fff; opacity: 0.8; margin-bottom: 30px; text-transform: uppercase; }

        /* --- CARD CHRISTMAS TREE --- */
        .tree-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 40px; transform: scale(0.9); }
        .star { color: var(--gold); font-size: 2.5rem; margin-bottom: -5px; filter: drop-shadow(0 0 10px var(--gold)); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
        .tree-row { display: flex; justify-content: center; margin-top: -35px; }
        .tree-card {
            width: 50px; height: 75px; background: #fff; border-radius: 4px; border: 1.5px solid var(--gold);
            margin: 2px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; font-weight: 900; color: #000;
        }
        .tree-card.red { color: var(--xmas-red); }
        .trunk { width: 40px; height: 50px; background: #3d1c02; border: 2px solid #2b1b0d; border-radius: 2px; margin-top: -5px; }

        /* --- START BUTTON --- */
        .btn-start {
            background: var(--gold-grad); color: #1a472a; border: none;
            padding: 18px 60px; border-radius: 50px; font-weight: 900; font-size: 1.3rem;
            text-transform: uppercase; cursor: pointer; box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            transition: transform 0.2s;
        }
        .btn-start:active { transform: scale(0.95); }

        #game-view { display: none; }
    </style>
</head>
<body>

    <canvas id="snow-canvas"></canvas>

    <div id="home-page">
        <h1 class="main-title">Ai Rummy</h1>

        <p class="sub-message">Reveal the Joker</p>

        <div class="tree-container">
            <div class="star">★</div>
            <div class="tree-row"><div class="tree-card red">A♥</div></div>
            <div class="tree-row">
                <div class="tree-card">K♠</div>
                <div class="tree-card red">Q♦</div>
            </div>
            <div class="tree-row">
                <div class="tree-card red">J♥</div>
                <div class="tree-card">10♣</div>
                <div class="tree-card">9♠</div>
            </div>
            <div class="tree-row">
                <div class="tree-card red">8♦</div>
                <div class="tree-card">7♣</div>
                <div class="tree-card red">6♥</div>
                <div class="tree-card">5♠</div>
            </div>
            <div class="trunk"></div>
        </div>

        <button class="btn-start" onclick="startGame()">Start Game</button>
        
        <p style="margin-top: 30px; font-size: 0.7rem; color: var(--gold); font-weight: bold;">Opponent: Pandu AI</p>
    </div>

    <div id="game-view">
        </div>

<script>
    // Snowfall Engine
    const canvas = document.getElementById('snow-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, flakes = [];
    function init() {
        W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight;
        flakes = Array(60).fill().map(() => ({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*2+1 }));
    }
    function loop() {
        ctx.clearRect(0,0,W,H); ctx.fillStyle = "#fff"; ctx.beginPath();
        flakes.forEach(f => { ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); f.y += 0.5; if(f.y>H) f.y=-5; });
        ctx.fill(); requestAnimationFrame(loop);
    }
    window.addEventListener('resize', init); init(); loop();

    function startGame() {
        // Logic to switch to game-view
        document.getElementById('home-page').style.display = 'none';
        document.getElementById('game-view').style.display = 'flex';
    }
</script>
</body>
</html>
