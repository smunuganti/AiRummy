<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Rummy: Holiday 201 Pool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --card-w: 45px; --card-h: 65px; }
        body { background: #022c22; color: white; overflow: hidden; font-family: sans-serif; }
        .snowflake { position: fixed; top: -10px; color: white; pointer-events: none; z-index: 1000; animation: fall linear infinite; }
        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }
        
        /* Mobile Card Styling */
        .card { width: var(--card-w); height: var(--card-h); background: white; border-radius: 4px; border: 1px solid #ccc; 
                display: flex; align-items: center; justify-content: center; font-weight: bold; color: black; font-size: 12px; }
        .card.selected { transform: translateY(-10px); border: 2px solid #fbbf24; box-shadow: 0 4px 10px rgba(251,191,36,0.5); }
        .slot { min-height: 85px; background: rgba(255,255,255,0.05); border-radius: 8px; border: 1px dashed rgba(255,255,255,0.2); display: flex; flex-wrap: wrap; gap: 4px; padding: 10px; }
        #slot-1 { border-color: #22c55e; background: rgba(34,197,94,0.05); }
    </style>
</head>
<body>

    <div id="home" class="fixed inset-0 z-[100] bg-emerald-950 flex flex-col items-center justify-center p-6 text-center">
        <div id="snow-bg" class="absolute inset-0"></div>
        
        <div class="mb-6 relative scale-125">
            <div class="text-yellow-400 text-2xl mb-1 animate-bounce">⭐</div>
            <div class="flex -space-x-4"><div class="card h-10 w-8 rotate-[-5deg]">A♥</div></div>
            <div class="flex -space-x-4"><div class="card h-10 w-8 rotate-[-10deg]">K♠</div><div class="card h-10 w-8 rotate-[10deg]">Q♦</div></div>
            <div class="w-4 h-3 bg-amber-900 mx-auto"></div>
        </div>

        <h1 class="text-4xl font-black mb-2">AI RUMMY</h1>
        <p class="text-yellow-500 text-xs font-bold tracking-widest mb-6">CLOSED JOKER • 201 POOL</p>
        <button onclick="enterGame()" class="bg-red-600 px-10 py-4 rounded-full font-black text-xl shadow-xl active:scale-95 transition">START GAME</button>
    </div>

    <div id="game-ui" class="hidden h-screen flex flex-col">
        <div class="flex justify-between p-3 bg-black/40 border-b border-white/10">
            <div class="text-green-400 text-xs font-bold">YOU: <span id="p-score">0</span></div>
            <div id="round-msg" class="text-[10px] text-gray-400">ROUND 1</div>
            <div class="text-red-400 text-xs font-bold">AI: <span id="ai-score">0</span></div>
        </div>

        <div class="flex justify-around items-center py-6 bg-white/5">
            <div onclick="draw('deck')" class="w-14 h-20 bg-red-800 rounded border-2 border-white flex items-center justify-center shadow-lg">❄️</div>
            <div id="joker-box" class="w-14 h-20 bg-indigo-900 border-2 border-yellow-500 rounded flex items-center justify-center">🎁</div>
            <div id="discard-pile" onclick="draw('discard')" class="card !w-14 !h-20 bg-gray-200"></div>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-4">
            <div><p class="text-[9px] text-green-400 mb-1">SLOT 1: PURE SEQUENCE (3+)</p><div id="slot-1" class="slot" onclick="moveToSlot(1)"></div></div>
            <div><p class="text-[9px] text-gray-400 mb-1">SLOTS 2-4: SETS & SEQUENCES</p><div id="slot-2" class="slot" onclick="moveToSlot(2)"></div></div>
        </div>

        <div class="p-4 bg-black/40 grid grid-cols-3 gap-2">
            <button onclick="handleDrop()" class="bg-orange-700 py-3 rounded text-[10px] font-bold">DROP (-20)</button>
            <div id="discard-btn" onclick="discardCard()" class="bg-gray-600 py-3 rounded text-[10px] font-bold text-center border-2 border-white/20">DISCARD</div>
            <div id="show-btn" onclick="placeShow()" class="bg-yellow-600 py-3 rounded text-[10px] font-bold text-center border-2 border-yellow-300">PLACE SHOW</div>
        </div>
    </div>

    <script>
        // --- Core Engine ---
        let state = { pScore: 0, aiScore: 0, round: 1, pHand: [], slots: [[],[],[],[]], selected: null, hasDrawn: false, joker: null };

        function enterGame() {
            document.getElementById('home').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            initRound();
        }

        function initRound() {
            // Simplified deal for deployment test
            state.hasDrawn = false;
            state.pHand = Array(13).fill(null).map((_, i) => ({v: '7', s: '♥', c: 'text-red-600', id: i})); 
            // Manual Logic: Real card generator would go here
            renderUI();
        }

        function renderUI() {
            document.getElementById('p-score').innerText = state.pScore;
            document.getElementById('ai-score').innerText = state.aiScore;
            // Additional rendering logic for slots...
        }

        function handleDrop() {
            const penalty = state.hasDrawn ? 40 : 20;
            if(confirm(`Drop this hand for ${penalty} points?`)) {
                state.pScore += penalty;
                initRound();
            }
        }

        // --- Snowfall Init ---
        const snow = document.getElementById('snow-bg');
        for(let i=0; i<30; i++) {
            const s = document.createElement('div');
            s.className = 'snowflake'; s.innerHTML = '❄';
            s.style.left = Math.random()*100+'vw';
            s.style.animationDuration = (Math.random()*3+2)+'s';
            snow.appendChild(s);
        }
    </script>
</body>
</html>
